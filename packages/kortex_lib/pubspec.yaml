name: kortex_lib
description: "Utility toolkit for Kortex apps: Brazilian validators/formatters, core patterns, REST and SQLite helpers, and reusable widgets."
version: 0.1.1
repository: https://github.com/DenersonNobre/Kortex
issue_tracker: https://github.com/DenersonNobre/Kortex/issues
topics:
  - utilities
  - flutter
  - rest
  - sqlite
  - validation

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  kortex: ^0.2.3
  kortex_forms: ^0.1.1
  crypto: ^3.0.3
  encrypt: ^5.0.3
  http: ^1.1.0
  sqflite: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0
  sqflite_common_ffi: ^2.3.0
  test: ^1.25.0

flutter:
  uses-material-design: true
