name: kortex_lib
description: "Opt-in umbrella barrel re-exporting kortex_core, kortex_rest, and kortex_sqlite."
version: 0.1.1
repository: https://github.com/DenersonNobre/Kortex
issue_tracker: https://github.com/DenersonNobre/Kortex/issues
topics:
  - utilities
  - flutter
  - rest
  - sqlite
  - validation

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  kortex: ^0.2.3
  kortex_core: ^0.1.0
  kortex_forms: ^0.1.1
  kortex_rest: ^0.1.0
  kortex_sqlite: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
