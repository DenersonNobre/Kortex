version: 0.1.2
repository: https://github.com/DenersonNobre/Kortex
issue_tracker: https://github.com/DenersonNobre/Kortex/issues
topics:
  - forms
  - validation
  - state-management
  - signals
  - flutter

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  kortex: ^0.2.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
