# CI do Kortex no GitHub Actions (espelho do `.gitea/workflows/ci.yml`).
#
# Flutter pinado na 3.47.6 (a 3.50.0 deprecia `material.dart`, o que
# conflita com o RNF-01 zero-deps; ver LEARNINGS). Mesmos comandos do DoD
# local: format, analyze, test — qualquer exit != 0 reprova o job.
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'

      - name: Format check (igual ao gate local)
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - name: Analyze (zero warnings)
        run: flutter analyze

      - name: Test (suite completa)
        run: flutter test

      - name: Analyze example (zero warnings)
        working-directory: example
        run: flutter analyze

      - name: Test example (smoke)
        working-directory: example
        run: flutter test
