# CI do Kortex no GitHub Actions (espelho do `.gitea/workflows/ci.yml`).
#
# Flutter pinado na 3.47.6 (a 3.50.0 deprecia `material.dart`, o que
# conflita com o RNF-01 zero-deps; ver LEARNINGS). Mesmos comandos do DoD
# local: format, analyze, test — qualquer exit != 0 reprova o job.
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'

      - name: Workspace pub get
        run: flutter pub get

      - name: Format check (igual ao gate local)
        run: dart format --output=none --set-exit-if-changed packages/kortex_state/lib packages/kortex_state/test packages/kortex_state/example/lib packages/kortex_state/example/test packages/kortex_lib/lib packages/kortex_lib/test packages/kortex_lint/lib packages/kortex_lint/test packages/kortex_persist/lib packages/kortex_persist/test poc/lib poc/test

      - name: Kortex (analyze + test)
        working-directory: packages/kortex_state
        run: |
          flutter analyze
          flutter test

      - name: Kortex Lib (analyze + test)
        working-directory: packages/kortex_lib
        run: |
          flutter analyze
          flutter test

      - name: Kortex Lint (analyze + test)
        working-directory: packages/kortex_lint
        run: |
          dart analyze
          dart test

      - name: Kortex Persist (analyze + test)
        working-directory: packages/kortex_persist
        run: |
          flutter analyze
          flutter test

      - name: Example (pub get + analyze + test)
        working-directory: packages/kortex_state/example
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: POC (analyze + test)
        working-directory: poc
        run: |
          flutter analyze
          flutter test
