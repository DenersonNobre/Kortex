name: poc
description: POC do pacote kortex (StatelessWidget-first, zero dependências de runtime; leak tracking só em dev).
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  kortex:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Apenas teste: gate de vazamento de memoria (nao entra no app).
  leak_tracker: ^11.0.2
  leak_tracker_testing: ^3.0.2

flutter:
  uses-material-design: true
